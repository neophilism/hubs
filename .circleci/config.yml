version: 2.1

# Maintained CircleCI syntax replacing deprecated circleci/node:14.5.
# This legacy Mozilla Hubs fork has old Webpack dependencies and MUST be
# test-run before switching a production/release dependency to CircleCI.
jobs:
  full-verification:
    docker:
      - image: cimg/node:20.19.5-browsers
    resource_class: large
    environment:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - checkout
      - run:
          name: Install exact legacy lockfile dependencies
          command: npm ci
      - run:
          name: Existing lint, unit tests and Webpack release build
          command: npm test
      - store_artifacts:
          path: dist
workflows:
  complete-source-checks:
    jobs:
      - full-verification
